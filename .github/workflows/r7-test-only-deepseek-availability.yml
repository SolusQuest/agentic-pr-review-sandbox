name: R7 provider availability check
on:
  workflow_dispatch:
    inputs:
      expected-sandbox-sha:
        type: string
        required: true
permissions: {}
concurrency:
  group: r7-provider-availability-sandbox-1383960589
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.repository == 'SolusQuest/agentic-pr-review-sandbox' && github.repository_id == '1383960589' && github.actor_id == '16307884' && github.triggering_actor == github.actor && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == github.workflow_sha && inputs.expected-sandbox-sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check existing DeepSeek account availability
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, ProxyHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def outcome():
              key = os.environ.pop('DEEPSEEK_API_KEY', '')
              if not key or any(ord(char) < 33 or ord(char) > 126 for char in key):
                  return 'credential-unavailable'
              req = Request('https://api.deepseek.com/user/balance', method='GET',
                            headers={'Authorization': 'Bearer ' + key, 'Accept': 'application/json'})
              try:
                  with build_opener(ProxyHandler({}), NoRedirect()).open(req, timeout=15) as response:
                      payload = response.read(8193)
                      if response.status != 200 or len(payload) > 8192:
                          return 'invalid-response'
                      result = json.loads(payload)
                  if isinstance(result, dict) and type(result.get('is_available')) is bool:
                      return 'available' if result['is_available'] else 'insufficient-balance'
                  return 'invalid-response'
              except HTTPError as exc:
                  code = exc.code
                  exc.close()
                  return {401: 'authentication-refused', 402: 'insufficient-balance',
                          403: 'access-refused', 429: 'rate-limited'}.get(
                              code, 'service-unavailable' if 500 <= code < 600 else 'unexpected-http')
              except (URLError, TimeoutError, OSError):
                  return 'transport-unavailable'
              except (UnicodeError, ValueError, TypeError):
                  return 'invalid-response'

          print('APR_TEST_ONLY_PROVIDER_AVAILABILITY ' + outcome())
          PY
